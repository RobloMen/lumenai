<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumenAI | Premium AI Assistant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #00f5ff;
            --primary-glow: #00a2ff;
            --secondary: #ff00e5;
            --accent: #00ff95;
            --background: #0a0a1a;
            --surface: #151530;
            --surface-glow: #1e1e40;
            --text: #ffffff;
            --text-secondary: #b8b8ff;
            --success: #00ff95;
            --warning: #ffb800;
            --error: #ff4757;
            --user-msg: rgba(0, 245, 255, 0.15);
            --ai-msg: rgba(30, 30, 64, 0.8);
            --premium-gold: #ffd700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .neon-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 245, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 0, 229, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 255, 149, 0.05) 0%, transparent 50%);
            z-index: -2;
        }

        .app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* Auth Screens */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-box {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .auth-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 30px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .auth-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-input {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.1);
        }

        .auth-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 245, 255, 0.3);
        }

        /* Main App */
        .main-app {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            gap: 20px;
            height: calc(100vh - 140px);
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--surface);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .new-chat-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 245, 255, 0.3);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .history-item.active {
            background: rgba(0, 245, 255, 0.1);
            border-color: var(--primary);
        }

        .history-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .history-preview {
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            background: var(--surface);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.6;
            position: relative;
            animation: fadeIn 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: var(--user-msg);
            border-bottom-right-radius: 5px;
        }

        .ai-message {
            align-self: flex-start;
            background: var(--ai-msg);
            border-bottom-left-radius: 5px;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .message-content {
            word-wrap: break-word;
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 8px;
            text-align: right;
            opacity: 0.7;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--surface-glow);
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: end;
        }

        .message-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            color: var(--text);
            font-size: 1rem;
            resize: none;
            min-height: 60px;
            max-height: 120px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.1);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 245, 255, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            background: var(--ai-msg);
            border-radius: 18px;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 10px 0;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        /* API Status */
        .api-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--surface);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        .status-dot.connected { background: var(--success); }
        .status-dot.error { background: var(--error); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Premium Badge */
        .premium-badge {
            background: linear-gradient(135deg, var(--premium-gold), #ff6b00);
            color: #000;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-left: 8px;
        }

        /* Welcome Message */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .welcome-message h3 {
            margin-bottom: 10px;
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="neon-bg"></div>
    
    <!-- Authentication Screen -->
    <div class="auth-container" id="authContainer">
        <div class="auth-box">
            <div class="auth-logo">
                <div class="logo">
                    <i class="fas fa-brain-circuit"></i>
                    LumenAI
                </div>
                <div style="color: var(--text-secondary); font-size: 0.9rem;">
                    Премиум AI ассистент с Gemini
                </div>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">Вход</div>
                <div class="auth-tab" data-tab="register">Регистрация</div>
            </div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Войти в LumenAI
                </button>
            </form>

            <form class="auth-form" id="registerForm" style="display: none;">
                <div class="form-group">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" class="form-input" id="registerUsername" placeholder="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="registerEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-input" id="registerPassword" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Подтвердите пароль</label>
                    <input type="password" class="form-input" id="registerConfirmPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">
                    <i class="fas fa-user-plus"></i>
                    Создать аккаунт
                </button>
            </form>
        </div>
    </div>

    <!-- Main Application -->
    <div class="main-app" id="mainApp">
        <!-- API Status -->
        <div class="api-status">
            <div class="status-dot connected"></div>
            <span>Gemini API Connected</span>
        </div>

        <!-- Header -->
        <div class="header">
            <div class="logo">
                <i class="fas fa-brain-circuit"></i>
                LumenAI
            </div>
            <div class="user-menu">
                <div class="user-avatar" id="userAvatar">U</div>
                <span id="userName">User</span>
                <span class="premium-badge">PREMIUM</span>
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    Выйти
                </button>
            </div>
        </div>

        <!-- Chat Interface -->
        <div class="chat-container">
            <!-- Sidebar -->
            <div class="sidebar">
                <button class="new-chat-btn" id="newChatBtn">
                    <i class="fas fa-plus"></i>
                    Новый чат
                </button>
                <div class="chat-history" id="chatHistory">
                    <!-- История чатов будет здесь -->
                </div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area">
                <div class="messages-container" id="messagesContainer">
                    <div class="welcome-message">
                        <h3>Добро пожаловать в LumenAI! 🚀</h3>
                        <p>Я ваш AI-ассистент на основе Gemini. Задайте мне любой вопрос!</p>
                    </div>
                </div>

                <!-- Typing Indicator -->
                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                    <span>LumenAI генерирует ответ...</span>
                </div>

                <!-- Input Area -->
                <div class="input-area">
                    <div class="input-container">
                        <textarea 
                            class="message-input" 
                            id="messageInput" 
                            placeholder="Задайте вопрос LumenAI..."
                            rows="1"
                        ></textarea>
                        <button class="send-btn" id="sendButton">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация Gemini API с вашим ключом
        const GEMINI_API_CONFIG = {
            apiKey: "AIzaSyDZhU8prBy8ECBPVSS94V_KKPydT9DRqeU",
            apiUrl: "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent"
        };

        class LumenAI {
            constructor() {
                this.currentUser = null;
                this.conversationHistory = [];
                this.currentChatId = this.generateChatId();
                this.isProcessing = false;
                
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.checkAuthentication();
            }

            setupEventListeners() {
                // Аутентификация
                document.querySelectorAll('.auth-tab').forEach(tab => {
                    tab.addEventListener('click', () => this.switchAuthTab(tab.dataset.tab));
                });

                document.getElementById('loginForm').addEventListener('submit', (e) => this.handleLogin(e));
                document.getElementById('registerForm').addEventListener('submit', (e) => this.handleRegister(e));
                document.getElementById('logoutBtn').addEventListener('click', () => this.handleLogout());

                // Чат
                document.getElementById('sendButton').addEventListener('click', () => this.sendMessage());
                document.getElementById('messageInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                document.getElementById('messageInput').addEventListener('input', this.autoResizeTextarea);
                document.getElementById('newChatBtn').addEventListener('click', () => this.newChat());
            }

            autoResizeTextarea() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            }

            switchAuthTab(tab) {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

                document.getElementById('loginForm').style.display = tab === 'login' ? 'flex' : 'none';
                document.getElementById('registerForm').style.display = tab === 'register' ? 'flex' : 'none';
            }

            async handleLogin(e) {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;

                // Симуляция аутентификации
                this.currentUser = {
                    id: 'user_' + Date.now(),
                    username: email.split('@')[0],
                    email: email,
                    avatar: email[0].toUpperCase()
                };

                localStorage.setItem('lumenai_user', JSON.stringify(this.currentUser));
                this.showMainApp();
            }

            async handleRegister(e) {
                e.preventDefault();
                const username = document.getElementById('registerUsername').value;
                const email = document.getElementById('registerEmail').value;
                const password = document.getElementById('registerPassword').value;
                const confirmPassword = document.getElementById('registerConfirmPassword').value;

                if (password !== confirmPassword) {
                    alert('Пароли не совпадают!');
                    return;
                }

                // Симуляция регистрации
                this.currentUser = {
                    id: 'user_' + Date.now(),
                    username: username,
                    email: email,
                    avatar: username[0].toUpperCase()
                };

                localStorage.setItem('lumenai_user', JSON.stringify(this.currentUser));
                this.showMainApp();
            }

            handleLogout() {
                localStorage.removeItem('lumenai_user');
                this.currentUser = null;
                this.showAuthScreen();
            }

            checkAuthentication() {
                const savedUser = localStorage.getItem('lumenai_user');
                if (savedUser) {
                    this.currentUser = JSON.parse(savedUser);
                    this.showMainApp();
                } else {
                    this.showAuthScreen();
                }
            }

            showAuthScreen() {
                document.getElementById('authContainer').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }

            showMainApp() {
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                
                this.updateUserInfo();
                this.loadChatHistory();
            }

            updateUserInfo() {
                if (this.currentUser) {
                    document.getElementById('userName').textContent = this.currentUser.username;
                    document.getElementById('userAvatar').textContent = this.currentUser.avatar;
                }
            }

            async sendMessage() {
                const messageInput = document.getElementById('messageInput');
                const message = messageInput.value.trim();
                
                if (!message || this.isProcessing) return;

                // Убираем welcome сообщение при первом сообщении
                const welcomeMessage = document.querySelector('.welcome-message');
                if (welcomeMessage) {
                    welcomeMessage.remove();
                }

                // Добавляем сообщение пользователя
                this.addMessage(message, 'user');
                messageInput.value = '';
                this.autoResizeTextarea.call(messageInput);
                
                // Показываем индикатор набора
                this.showTypingIndicator();
                this.isProcessing = true;
                this.updateSendButton();

                try {
                    const response = await this.callGeminiAPI(message);
                    this.addMessage(response, 'ai');
                } catch (error) {
                    console.error('Ошибка:', error);
                    this.addMessage('Извините, произошла ошибка при обработке запроса: ' + error.message, 'ai');
                }

                this.hideTypingIndicator();
                this.isProcessing = false;
                this.updateSendButton();
            }

            async callGeminiAPI(userMessage) {
                const response = await fetch(`${GEMINI_API_CONFIG.apiUrl}?key=${GEMINI_API_CONFIG.apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: userMessage
                            }]
                        }],
                        generationConfig: {
                            temperature: 0.7,
                            topK: 40,
                            topP: 0.95,
                            maxOutputTokens: 1024,
                        }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                    throw new Error('Неверный формат ответа от Gemini API');
                }
                
                return data.candidates[0].content.parts[0].text;
            }

            addMessage(content, role) {
                const message = {
                    id: Date.now(),
                    role: role,
                    content: content,
                    timestamp: new Date().toLocaleTimeString()
                };

                this.conversationHistory.push(message);
                this.displayMessage(message);
                this.saveChatHistory();
            }

            displayMessage(message) {
                const messagesContainer = document.getElementById('messagesContainer');
                const messageElement = document.createElement('div');
                messageElement.className = `message ${message.role}-message`;
                
                const headerText = message.role === 'user' ? 'Вы' : '<i class="fas fa-robot"></i> LumenAI';
                
                messageElement.innerHTML = `
                    <div class="message-header">${headerText}</div>
                    <div class="message-content">${this.formatMessage(message.content)}</div>
                    <div class="message-time">${message.timestamp}</div>
                `;

                messagesContainer.appendChild(messageElement);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            formatMessage(content) {
                return content.replace(/\n/g, '<br>');
            }

            showTypingIndicator() {
                document.getElementById('typingIndicator').style.display = 'flex';
                document.getElementById('messagesContainer').scrollTop = document.getElementById('messagesContainer').scrollHeight;
            }

            hideTypingIndicator() {
                document.getElementById('typingIndicator').style.display = 'none';
            }

            newChat() {
                this.conversationHistory = [];
                this.currentChatId = this.generateChatId();
                document.getElementById('messagesContainer').innerHTML = '<div class="welcome-message"><h3>Добро пожаловать в LumenAI! 🚀</h3><p>Я ваш AI-ассистент на основе Gemini. Задайте мне любой вопрос!</p></div>';
                this.updateChatHistory();
            }

            generateChatId() {
                return 'chat_' + Date.now();
            }

            saveChatHistory() {
                if (!this.currentUser) return;

                const chatData = {
                    id: this.currentChatId,
                    title: this.conversationHistory[0]?.content.substring(0, 30) + '...' || 'Новый чат',
                    messages: this.conversationHistory,
                    timestamp: Date.now()
                };
                
                let userChats = JSON.parse(localStorage.getItem(`lumenai_chats_${this.currentUser.id}`) || '[]');
                const existingIndex = userChats.findIndex(chat => chat.id === this.currentChatId);
                
                if (existingIndex !== -1) {
                    userChats[existingIndex] = chatData;
                } else {
                    userChats.push(chatData);
                }
                
                localStorage.setItem(`lumenai_chats_${this.currentUser.id}`, JSON.stringify(userChats));
                this.updateChatHistory();
            }

            loadChatHistory() {
                if (!this.currentUser) return;

                const userChats = JSON.parse(localStorage.getItem(`lumenai_chats_${this.currentUser.id}`) || '[]');
                this.updateChatHistory();
            }

            updateChatHistory() {
                const chatHistory = document.getElementById('chatHistory');
                if (!this.currentUser) return;

                const userChats = JSON.parse(localStorage.getItem(`lumenai_chats_${this.currentUser.id}`) || '[]');
                
                chatHistory.innerHTML = userChats.map(chat => `
                    <div class="history-item ${chat.id === this.currentChatId ? 'active' : ''}" 
                         onclick="lumenAI.loadChat('${chat.id}')">
                        <div class="history-title">${chat.title}</div>
                        <div class="history-preview">${new Date(chat.timestamp).toLocaleDateString()}</div>
                    </div>
                `).join('') || '<div style="text-align: center; color: var(--text-secondary); padding: 20px;">Нет истории чатов</div>';
            }

            loadChat(chatId) {
                if (!this.currentUser) return;

                const userChats = JSON.parse(localStorage.getItem(`lumenai_chats_${this.currentUser.id}`) || '[]');
                const chat = userChats.find(c => c.id === chatId);
                
                if (chat) {
                    this.currentChatId = chatId;
                    this.conversationHistory = chat.messages;
                    
                    const messagesContainer = document.getElementById('messagesContainer');
                    messagesContainer.innerHTML = '';
                    this.conversationHistory.forEach(msg => this.displayMessage(msg));
                    
                    this.updateChatHistory();
                }
            }

            updateSendButton() {
                const sendButton = document.getElementById('sendButton');
                const messageInput = document.getElementById('messageInput');
                
                sendButton.disabled = this.isProcessing || !messageInput.value.trim();
            }
        }

        // Инициализация приложения
        let lumenAI;
        document.addEventListener('DOMContentLoaded', () => {
            lumenAI = new LumenAI();
        });
    </script>
</body>
</html>
